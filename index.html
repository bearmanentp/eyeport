<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>EyePort</title>
    <style>
        body { 
            margin: 0; background: #000; color: #fff; font-family: sans-serif; 
            text-align: center; display: flex; flex-direction: column; 
            height: 100vh; overflow: hidden;
            touch-action: none; user-select: none; -webkit-user-select: none;
        }
        /* 처음 카메라 권한 승인용 전체 화면 버튼 */
        #init-btn {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: #111; color: #fff; font-size: 28px; font-weight: bold;
            border: none; z-index: 9999; cursor: pointer; padding: 20px; box-sizing: border-box;
        }
        /* 시각장애인을 위한 화면 이분할 터치 영역 */
        .touch-zone {
            flex: 1; display: flex; justify-content: center; align-items: center;
            font-size: 32px; font-weight: bold; box-sizing: border-box; text-align: center;
            padding: 20px; word-break: keep-all; width: 100%;
        }
        #zone-single { background: #1a1a1a; border-bottom: 4px solid #333; }
        #zone-continuous { background: #2a1010; }
        #zone-continuous.active { background: #801010; color: #ffcccc; }
        
        /* 결과 안내 텍스트 영역 (저시력자용 거대 폰트) */
        #status-area {
            position: fixed; top: 40%; left: 5%; width: 90%;
            background: rgba(0,0,0,0.85); color: #00ffcc; font-size: 26px;
            font-weight: bold; padding: 20px; box-sizing: border-box;
            border-radius: 10px; pointer-events: none; min-height: 120px;
            display: flex; justify-content: center; align-items: center; word-break: keep-all;
        }
    </style>
</head>
<body>

    <!-- 앱 실행 시 최초 1회 화면 전체 터치 유도 -->
    <button id="init-btn">EyePort 시작하기<br><br>화면을 터치하여<br>카메라와 음성을 허용하세요.</button>

    <!-- 시각장애인이 터치하기 쉬운 거대 이분할 레이아웃 -->
    <div id="zone-single" class="touch-zone" role="button" aria-label="화면 상단, 한 번만 주변 탐색하기">주변 탐색</div>
    <div id="zone-continuous" class="touch-zone" role="button" aria-label="화면 하단, 실시간 연속 탐색 시작 및 종료">실시간 탐색 끔</div>
    
    <!-- 상태 및 AI 답변 출력창 -->
    <div id="status-area">EyePort 준비 완료</div>

    <script>
        // ⚠️ [필수] 본인의 구글 앱스 스크립트 웹 앱 URL을 붙여넣으세요.
        const GAS_WEB_APP_URL = "https://script.google.com/macros/s/AKfycbytgZAUDGX1KWusFHdDB2Z6nAnhZE-bJGbCyVUShAfOoKroDIIo-g4it4ZYLEMnTkdZ/exec";

        const initBtn = document.getElementById('init-btn');
        const zoneSingle = document.getElementById('zone-single');
        const zoneContinuous = document.getElementById('zone-continuous');
        const statusArea = document.getElementById('status-area');

        let isProcessing = false;
        let isContinuousMode = false;
        let continuousInterval = null;
        let isCameraReady = false;

        const hiddenVideo = document.createElement('video');
        hiddenVideo.setAttribute('playsinline', '');
        hiddenVideo.setAttribute('autoplay', '');
        hiddenVideo.muted = true;

        // 스마트폰 자체 음성 합성(TTS) 기능
        function speak(text) {
            window.crypto && window.speechSynthesis.cancel(); // 이전 음성 급정지
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'ko-KR';
            utterance.rate = 1.1; // 안내 속도 약간 빠르게
            window.speechSynthesis.speak(utterance);
        }

        // 초기화 버튼 이벤트 (보안 필터 뚫기 및 오디오 활성화)
        initBtn.addEventListener('click', async () => {
            initBtn.innerText = "연동을 시작합니다...";
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { facingMode: "environment", width: 640, height: 480 } 
                });
                hiddenVideo.srcObject = stream;
                await hiddenVideo.play();
                isCameraReady = true;
                initBtn.style.display = 'none';
                speak("아이포트가 준비되었습니다. 화면 위쪽을 누르면 주변을 한 번 탐색하고, 아래쪽을 누르면 실시간 탐색을 시작합니다.");
            } catch (err) {
                initBtn.innerHTML = "❌ 카메라 권한 거부됨<br><br>브라우저 설정에서 카메라 권한을 열어주세요.";
                speak("카메라 권한을 얻지 못했습니다. 설정에서 권한을 확인해주세요.");
            }
        });

        // 이미지 캡처 및 AI 분석 전송
        async function captureAndAnalyze() {
            if (!isCameraReady) return;
            
            const canvas = document.createElement('canvas');
            canvas.width = hiddenVideo.videoWidth || 640;
            canvas.height = hiddenVideo.videoHeight || 480;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(hiddenVideo, 0, 0, canvas.width, canvas.height);
            
            const dataUrl = canvas.toDataURL('image/jpeg', 0.6);
            const base64Str = dataUrl.split(',')[1];

            try {
                const response = await fetch(GAS_WEB_APP_URL, {
                    method: 'POST',
                    body: JSON.stringify({ image: base64Str })
                });
                const data = await response.json();
                
                if (data.description) {
                    statusArea.innerText = data.description;
                    speak(data.description); // AI 분석 결과 음성 출력
                } else if (data.error) {
                    statusArea.innerText = "서버 오류 발생";
                    speak("서버 오류가 발생했습니다.");
                }
            } catch (err) {
                statusArea.innerText = "연동 실패";
                speak("연결이 원활하지 않습니다.");
            } finally {
                isProcessing = false;
            }
        }

        // 1. 상단 터치 영역: 단발성 주변 탐색
        zoneSingle.addEventListener('touchstart', (e) => {
            e.preventDefault();
            if (!isCameraReady || isProcessing || isContinuousMode) return;

            isProcessing = true;
            statusArea.innerText = "📸 분석 중...";
            speak("사진을 촬영합니다. 잠시만 기다려주세요.");
            captureAndAnalyze();
        });

        // 2. 하단 터치 영역: 실시간 지속 탐색 토글
        zoneContinuous.addEventListener('touchstart', (e) => {
            e.preventDefault();
            if (!isCameraReady) return;

            if (!isContinuousMode) {
                // 지속 모드 켬
                isContinuousMode = true;
                zoneContinuous.classList.add('active');
                zoneContinuous.innerText = "실시간 탐색 중";
                statusArea.innerText = "🔄 실시간 추적 시작";
                speak("실시간 탐색을 시작합니다. 3초마다 주변을 안내합니다.");
                
                isProcessing = true;
                captureAndAnalyze();

                continuousInterval = setInterval(() => {
                    if (isProcessing) return;
                    isProcessing = true;
                    captureAndAnalyze();
                }, 3500); // 음성이 겹치지 않도록 3.5초 주기 부여
            } else {
                // 지속 모드 끔
                isContinuousMode = false;
                zoneContinuous.classList.remove('active');
                zoneContinuous.innerText = "실시간 탐색 끔";
                statusArea.innerText = "🛑 탐색 종료";
                clearInterval(continuousInterval);
                speak("실시간 탐색을 종료합니다.");
            }
        });
    </script>
</body>
</html>
