<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>EyePort</title>
    <style>
        body { margin: 0; background: #000; color: #fff; font-family: sans-serif; text-align: center; display: flex; flex-direction: column; height: 100vh; overflow: hidden; touch-action: none; user-select: none; -webkit-user-select: none; }
        #init-btn { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: #111; color: #fff; font-size: 28px; font-weight: bold; border: none; z-index: 9999; cursor: pointer; padding: 20px; box-sizing: border-box; }
        .touch-zone { flex: 1; display: flex; justify-content: center; align-items: center; font-size: 32px; font-weight: bold; box-sizing: border-box; text-align: center; padding: 20px; width: 100%; }
        #zone-single { background: #1a1a1a; border-bottom: 4px solid #333; }
        #zone-continuous { background: #2a1010; }
        #zone-continuous.active { background: #801010; }
        #status-area { position: fixed; top: 35%; left: 5%; width: 90%; background: rgba(0,0,0,0.9); color: #00ffcc; font-size: 24px; font-weight: bold; padding: 20px; box-sizing: border-box; border-radius: 10px; pointer-events: none; min-height: 150px; display: flex; justify-content: center; align-items: center; word-break: keep-all; }
    </style>
</head>
<body>

    <button id="init-btn">EyePort 시작<br><br>화면을 터치하세요.</button>
    <div id="zone-single" class="touch-zone">주변 탐색</div>
    <div id="zone-continuous" class="touch-zone">실시간 탐색 끔</div>
    <div id="status-area">EyePort 준비 완료</div>

    <script>
        // ⚠️ 방금 새로 배포한 구글 웹 앱 /exec 주소로 정확히 교체하세요.
        const GAS_WEB_APP_URL = "https://script.google.com/macros/s/AKfycbyOpm-X2kd3mUGx4Qq63WfhU7ZCnAsiyT7_Oc-AInAdaBnDZKXSOfCybrDQs8WG8WyBGQ/exec";

        const initBtn = document.getElementById('init-btn');
        const zoneSingle = document.getElementById('zone-single');
        const zoneContinuous = document.getElementById('zone-continuous');
        const statusArea = document.getElementById('status-area');

        let isProcessing = false;
        let isContinuousMode = false;
        let continuousInterval = null;
        let isCameraReady = false;

        const hiddenVideo = document.createElement('video');
        hiddenVideo.setAttribute('playsinline', '');
        hiddenVideo.setAttribute('autoplay', '');
        hiddenVideo.muted = true;

        function speak(text) {
            window.speechSynthesis && window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'ko-KR';
            utterance.rate = 1.1;
            window.speechSynthesis.speak(utterance);
        }

        initBtn.addEventListener('click', async () => {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { facingMode: "environment", width: 400, height: 300 } // 해상도 최적화 복구
                });
                hiddenVideo.srcObject = stream;
                await hiddenVideo.play();
                isCameraReady = true;
                initBtn.style.display = 'none';
                speak("아이포트 준비 완료.");
            } catch (err) {
                initBtn.innerHTML = "카메라 에러";
            }
        });

        async function captureAndAnalyze() {
            if (!isCameraReady) return;
            
            const canvas = document.createElement('canvas');
            // 💡 데이터 경량화를 위해 400x300 사이즈로 캡처
            canvas.width = 400;
            canvas.height = 300;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(hiddenVideo, 0, 0, canvas.width, canvas.height);
            
            // 압축률을 0.3으로 낮춰 텍스트 깨짐 현상 완벽 조율
            const dataUrl = canvas.toDataURL('image/jpeg', 0.3);
            const base64Str = dataUrl.split(',')[1];

            try {
                // 💡 안전한 GET 파라미터 전송 방식으로 교체
                const targetUrl = GAS_WEB_APP_URL + "?image=" + encodeURIComponent(base64Str);
                
                const response = await fetch(targetUrl, { method: 'GET' });
                const data = await response.json();
                
                if (data.description) {
                    statusArea.innerText = data.description;
                    speak(data.description);
                } else if (data.error) {
                    statusArea.innerText = "오류: " + data.error;
                }
            } catch (err) {
                statusArea.innerText = "네트워크 송신 오류";
            } finally {
                isProcessing = false;
            }
        }

        zoneSingle.addEventListener('touchstart', (e) => {
            e.preventDefault();
            if (!isCameraReady || isProcessing || isContinuousMode) return;
            isProcessing = true;
            statusArea.innerText = "📸 분석 중...";
            captureAndAnalyze();
        });

        zoneContinuous.addEventListener('touchstart', (e) => {
            e.preventDefault();
            if (!isCameraReady) return;

            if (!isContinuousMode) {
                isContinuousMode = true;
                zoneContinuous.classList.add('active');
                zoneContinuous.innerText = "실시간 탐색 중";
                isProcessing = true;
                captureAndAnalyze();

                continuousInterval = setInterval(() => {
                    if (isProcessing) return;
                    isProcessing = true;
                    captureAndAnalyze();
                }, 4500);
            } else {
                isContinuousMode = false;
                zoneContinuous.classList.remove('active');
                zoneContinuous.innerText = "실시간 탐색 끔";
                clearInterval(continuousInterval);
                speak("탐색 종료");
            }
        });
    </script>
</body>
</html>
